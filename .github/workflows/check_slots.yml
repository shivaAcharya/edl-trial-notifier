# .github/workflows/check_slots.yml
#
# Runs a slot availability check every 5 minutes for ALL users in users.json.
# The full users.json content is stored as a single GitHub Secret (USERS_CONFIG)
# so bearer tokens and ntfy topics are never committed to the repo.
#
# Setup steps:
#   1. Push this repo to GitHub (can be public — secrets are never exposed)
#   2. Go to: Settings → Secrets and variables → Actions → New repository secret
#   3. Add ONE secret:
#        USERS_CONFIG  →  paste the entire contents of your users.json here
#   4. Enable Actions: Actions tab → "I understand my workflows, enable them"
#
# To add a friend: edit users.json locally, re-copy the full contents
# into the USERS_CONFIG GitHub Secret.

name: EDL Trial Slot Check

on:
  schedule:
    # Runs every 5 minutes (GitHub Actions minimum granularity)
    # Note: runs may be delayed a few minutes during GitHub high-load periods
    - cron: '*/5 * * * *'

  # Allows manual trigger from the Actions tab
  # Set mode to "test" to verify API + push for all users without looping.
  workflow_dispatch:
    inputs:
      mode:
        description: 'Run mode: "once" (default) or "test" (sends a test push notification)'
        required: false
        default: 'once'

jobs:
  check-slots:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write users config from secret
        run: echo '${{ secrets.USERS_CONFIG }}' > users.json

      - name: Check slots for all users
        env:
          NTFY_TOPIC:      ${{ secrets.NTFY_TOPIC }}
          SCAN_DAYS_AHEAD: '60'
        run: |
          MODE="${{ github.event.inputs.mode }}"
          if [ "$MODE" = "test" ]; then
            python trial_slot_notifier.py --test
          else
            python trial_slot_notifier.py --once
          fi
