# .github/workflows/check_slots.yml
#
# Runs a slot availability check every 5 minutes for ALL users in users.json.
# The full users.json content is stored as a single GitHub Secret (USERS_CONFIG)
# so bearer tokens and ntfy topics are never committed to the repo.
#
# ── Scheduling ────────────────────────────────────────────────────────────────
# Primary trigger: cron-job.org fires a workflow_dispatch POST every 5 minutes.
#   → Reliable 5-minute polling (GitHub's built-in cron is throttled for
#     high-frequency schedules and routinely runs only every 1–6 hours.)
#
# Fallback: the schedule below runs once per hour in case cron-job.org is down.
#
# cron-job.org setup:
#   URL    : https://api.github.com/repos/shivaAcharya/edl-trial-notifier
#                /actions/workflows/check_slots.yml/dispatches
#   Method : POST
#   Headers: Authorization: Bearer {GITHUB_PAT}   (Actions: Read+Write scope)
#            Accept: application/vnd.github+json
#            X-GitHub-Api-Version: 2022-11-28
#            Content-Type: application/json
#   Body   : {"ref": "main"}
#   Schedule: every 5 minutes
# ─────────────────────────────────────────────────────────────────────────────

name: EDL Trial Slot Check

on:
  schedule:
    # Hourly fallback — primary scheduling is handled by cron-job.org
    - cron: '0 * * * *'

  # Primary trigger: cron-job.org POSTs here every 5 minutes.
  # Also used for manual runs from the Actions tab.
  # Set mode to "test" to verify API + push for all users without looping.
  workflow_dispatch:
    inputs:
      mode:
        description: 'Run mode: "once" (default) or "test" (sends a test push notification)'
        required: false
        default: 'once'

jobs:
  check-slots:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write users config from secret
        run: echo '${{ secrets.USERS_CONFIG }}' > users.json

      - name: Check slots for all users
        env:
          NTFY_TOPIC:      ${{ secrets.NTFY_TOPIC }}
          SCAN_DAYS_AHEAD: '60'
        run: |
          MODE="${{ github.event.inputs.mode }}"
          if [ "$MODE" = "test" ]; then
            python trial_slot_notifier.py --test
          else
            python trial_slot_notifier.py --once
          fi
